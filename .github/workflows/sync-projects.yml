name: Sync profile projects

on:
  schedule:
    - cron: '17 0 * * *' # 08:17 Asia/Shanghai; scheduled runs may be delayed.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile-projects.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sync-projects.yml'

concurrency:
  group: profile-projects-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Test project discovery and rendering
        run: python -m unittest discover -s tests -v
      - name: Synchronize and publish project cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            python scripts/update_projects.py
            git add -- README.md .github/project-sync-state.json
            if git diff --cached --quiet; then
              echo 'Project cards are up to date.'
              exit 0
            fi
            git commit -m 'chore: sync public project cards'
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch --no-tags origin main
            git reset --hard origin/main
          done
          echo 'Could not publish after concurrent changes. Please rerun the workflow.'
          exit 1
